<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Staff Login | Pixel Plates</title>

  <link
    rel="stylesheet"
    href="CSS/style.css"
  >
</head>

<body class="auth-page">
  <a
    href="index.html"
    class="brand auth-brand"
  >
    <span class="brand-mark">PP</span>
    <span>PIXEL PLATES</span>
  </a>

  <main class="auth-panel">
    <p class="kicker">
      RESTAURANT OPERATIONS
    </p>

    <h1>Welcome back.</h1>

    <p class="muted">
      Sign in with the account created by
      your restaurant administrator.
    </p>

    <div
      id="error"
      class="form-error login-message"
      role="alert"
      hidden
    ></div>

    <div
      id="success-message"
      class="form-success login-message"
      role="status"
      hidden
    ></div>

    <form id="login-form">
      <label for="email">
        Email address
      </label>

      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        placeholder="name@restaurant.com"
        required
      >

      <label for="password">
        Password
      </label>

      <div class="password-field">
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Your password"
          minlength="8"
          required
        >

        <button
          id="toggle-password"
          class="password-toggle"
          type="button"
          aria-label="Show password"
          aria-pressed="false"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
            ></path>

            <circle
              cx="12"
              cy="12"
              r="3"
            ></circle>
          </svg>
        </button>
      </div>

      <button
        id="forgot-password"
        class="forgot-password"
        type="button"
      >
        Forgot password?
      </button>

      <button
        id="login-button"
        class="login-submit"
        type="submit"
      >
        Enter workspace
      </button>
    </form>

    <div class="login-divider">
      <span>OR</span>
    </div>

    <button
      id="google-login"
      class="google-login"
      type="button"
    >
      <span class="google-symbol">G</span>
      <span>Continue with Google</span>
    </button>

    <p class="google-information">
      Google login will be activated after
      secure online hosting is configured.
    </p>
  </main>

  <!-- This preserves your original side picture. -->
  <div
    class="auth-image"
    role="img"
    aria-label="Restaurant meal"
  ></div>

  <dialog id="forgot-dialog">
    <div class="forgot-dialog-content">
      <div class="forgot-dialog-heading">
        <div>
          <p class="kicker">
            ACCOUNT RECOVERY
          </p>

          <h2>Forgot your password?</h2>
        </div>

        <button
          id="close-forgot-dialog"
          class="dialog-close"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
      </div>

      <p class="muted">
        Enter the email address connected
        to your staff account.
      </p>

      <form id="forgot-form">
        <label for="forgot-email">
          Email address
        </label>

        <input
          id="forgot-email"
          type="email"
          placeholder="name@restaurant.com"
          required
        >

        <button
          class="login-submit"
          type="submit"
        >
          Continue
        </button>
      </form>

      <div
        id="forgot-result"
        class="forgot-result"
        hidden
      ></div>
    </div>
  </dialog>

  <script
    type="module"
    src="JS/auth.js"
  ></script>
</body>
</html>
